name: Test

on:
  push:
  pull_request:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Unit tests plus the coverage gate on everything in js/. The stub-vs-real-API
      # checks in test/stub-api.test.js skip here: they need a local
      # Quickshell and Omarchy install.
      - run: npm test

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.11.2"
      # Every QML file (widget, tests and stubs) must match .qmlformat.ini.
      # Excluded: the HyprlandWorkspace/HyprlandMonitor stand-ins, which
      # must declare `property int id` to mirror the real API - the QML
      # engine accepts that, but qmlformat refuses to parse it.
      # qmllint isn't run: qs.* only resolves inside a live Quickshell, so
      # it can only ever be informational here.
      - name: QML files are formatted
        run: |
          git ls-files -z -- '*.qml' \
            ':!test/qml/stubs/Quickshell/Hyprland/HyprlandWorkspace.qml' \
            ':!test/qml/stubs/Quickshell/Hyprland/HyprlandMonitor.qml' \
            | xargs -0 qmlformat -i
          git diff --exit-code -- '*.qml'
      # Widget behaviour, headless, against the stand-in modules in
      # test/qml/stubs.
      - name: QML tests
        run: bash test/qml/run.sh
